    <script type="text/javascript">

        $(document).ready(function () {

	    var Gsite = location.href.substring(location.href.indexOf('?') + 6, location.href.indexOf('&'));

            for ( var i in _M.UserInfo ) { 
		_M.UserInfo[i] = "";

		if ( i == "SID" ) {
		    _M.UserInfo[i] = 44;
		} else if ( i == "dvl" ) {
			 _M.UserInfo[i] = 0;
		} else if ( i == "edl" ) {
			_M.UserInfo[i] = 1;
       		}
            }

            if ( Gsite == "CEO" || Gsite == "MS" || Gsite == "NU" || Gsite == "PRO" ) {
                _M.UserInfo.gsite = Gsite;$('.LoginPop').remove();

                $("#MainList").superContaner('superTable', '키맨ListJson_CTI_POP');
                $("#MainView").superContaner('superView', '키맨ViewJson_CTI_POP');

                alert("사이트 정보가 없습니다. 관리자에게 문의해주세요");
            }


        });
